name: Build & Release AdaptiveHz

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Release Keystore from Secret (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > adaptivehz-release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_KEYSTORE_BASE64 is not configured. Falling back to CI validation mode."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'adaptivehz' }}
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AdaptiveHz-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keystore.outputs.has_keystore == 'true' && 'AdaptiveHz-release-signed' || 'AdaptiveHz-release-ci-unsigned' }}
          path: AdaptiveHz-release.apk

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AdaptiveHz-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
